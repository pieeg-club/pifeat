[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pieeg-features"
version = "0.1.0"
description = "Zero-dependency native EEG feature extraction engine (Welch PSD, band powers, Hjorth, entropy)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "PiEEG Community"},
]
keywords = ["eeg", "bci", "neurofeedback", "pieeg", "dsp", "features", "welch", "hjorth", "entropy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/pieeg-club/PiEEG-features"
Repository = "https://github.com/pieeg-club/PiEEG-features"
Issues = "https://github.com/pieeg-club/PiEEG-features/issues"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "pieeg_features.pieeg_features"
