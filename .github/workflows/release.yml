name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Unit & Zero-Alloc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run pure-Rust unit tests
        run: cargo test --no-default-features --lib
      - name: Run zero-allocation verification
        run: cargo test --no-default-features --release --test bench_native -- --nocapture

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          manylinux: auto
      - name: Test x86_64 wheel against SciPy & NumPy
        if: matrix.target == 'x86_64'
        run: |
          pip install --only-binary=:all: numpy scipy pytest
          pip install --no-index --find-links=dist pieeg-features
          python tests/test_stdlib_zero_dep.py
          pytest -v
      - name: Set up QEMU for Raspberry Pi (ARMv7 / AArch64) container test
        if: matrix.target != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - name: Test ARMv7 wheel in 32-bit Raspberry Pi container (zero-dependency stdlib)
        if: matrix.target == 'armv7'
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/work" -w /work \
            arm32v7/python:3.12-slim-bookworm \
            sh -c "pip install --no-index --find-links=dist pieeg-features && python tests/test_stdlib_zero_dep.py"
      - name: Test AArch64 wheel in 64-bit Raspberry Pi container (zero-dependency stdlib)
        if: matrix.target == 'aarch64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/work" -w /work \
            arm64v8/python:3.12-slim-bookworm \
            sh -c "pip install --no-index --find-links=dist pieeg-features && python tests/test_stdlib_zero_dep.py"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
      - name: Test Apple Silicon wheel against SciPy & NumPy
        if: matrix.target == 'aarch64'
        run: |
          pip install --only-binary=:all: numpy scipy pytest
          pip install --no-index --find-links=dist pieeg-features
          python tests/test_stdlib_zero_dep.py
          pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
      - name: Test Windows x64 wheel against SciPy & NumPy
        run: |
          pip install --only-binary=:all: numpy scipy pytest
          pip install --no-index --find-links=dist pieeg-features
          python tests/test_stdlib_zero_dep.py
          pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [rust-tests, linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pieeg-features
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
