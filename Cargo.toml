[package]
name = "pieeg-features"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency, high-performance EEG feature extraction engine in Rust with Python bindings"
license = "AGPL-3.0-or-later"

[lib]
name = "pieeg_features"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
realfft = "3.4"

[features]
default = ["python"]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
